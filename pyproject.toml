[project]
name = "agent-factory"
version = "0.0.0"
description = "Usine d'agents : rôles, skills, hooks, télémétrie et dashboard de pilotage"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["apps/dashboard"]

[tool.uv.sources]
dashboard = { workspace = true }

[dependency-groups]
dev = [
  "dashboard",
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest>=8.3",
  "httpx>=0.28",
  "pip-audit>=2.7",
  "jsonschema>=4.23",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["scripts", "workflows"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["dashboard", "next_version", "hook_emit", "ship", "token_report"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps/dashboard/src", "infra/scripts", "tools/telemetry", "tools/agents"]

[tool.pytest.ini_options]
testpaths = ["apps/dashboard/tests", "infra/scripts", "tools/telemetry/tests", "tools/agents/tests"]
pythonpath = ["infra/scripts", "tools/telemetry", "tools/agents"]
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "-q --no-header -p no:cacheprovider"
